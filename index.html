<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario Alimentare</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f1f1;
            color: #333;
            padding: 20px;
            margin: 0;
        }

        h1, h2 {
            color: #4C7E92;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input[type="text"], input[type="number"], button {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background-color: #4C7E92;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #3b5e6a;
        }

        #result {
            margin-top: 20px;
        }

        #myChart {
            width: 100%;
            height: 250px;
        }

        .result {
            background-color: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>Diario Alimentare</h1>

    <div>
        <h2>Aggiungi Alimento al Database</h2>
        <label for="newFoodName">Nome Alimento:</label>
        <input type="text" id="newFoodName" placeholder="Es. Latte scremato Esselunga">
        
        <label for="newFoodCalcium">Calcio (mg per 100g/ml):</label>
        <input type="number" id="newFoodCalcium" placeholder="Es. 120">
        
        <label for="newFoodSodium">Sodio (g per 100g/ml, se non acqua):</label>
        <input type="number" id="newFoodSodium" placeholder="Es. 0.1">
        
        <label for="newFoodMarca">Marca:</label>
        <input type="text" id="newFoodMarca" placeholder="Es. Esselunga">
        
        <button id="addFoodButton">Aggiungi Alimento</button>
    </div>

    <div>
        <label for="foodInput">Cerca Alimento:</label>
        <input type="text" id="foodInput" placeholder="Es. Latte, Parmigiano">
    </div>

    <div>
        <label for="quantityInput">Quantità (in grammi/ml):</label>
        <input type="number" id="quantityInput" placeholder="Es. 100" min="1">
    </div>

    <button onclick="searchFood()">Cerca</button>

    <div id="result" class="result"></div>

    <button onclick="addToDiary()">Aggiungi al Diario</button>

    <div id="totals" class="totals">
        <p><strong>Totale Calcio di Oggi: </strong><span id="dailyTotalCalcium">0</span> mg</p>
        <p><strong>Totale Sodio di Oggi: </strong><span id="dailyTotalSodium">0</span> g</p>
    </div>

    <h2>Storico Diario Alimentare</h2>
    <ul id="diaryList"></ul>

    <h2>Grafico dei Progressi</h2>
    <canvas id="myChart"></canvas>

    <script>
        // Database alimenti italiani (esempio semplificato)
        let foodDB = [
            { name: "latte scremato esselunga", calcio: 120, sodio: 0.1, marca: "Esselunga", isWater: false },
            { name: "latte intero", calcio: 120, sodio: 0.1, marca: "Esselunga", isWater: false },
            { name: "acqua lete", calcio: 305, sodio: 5, marca: "Lete", isWater: true },  // 5mg sodio per litro
            { name: "ferrarelle", calcio: 400, sodio: 50, marca: "Ferrarelle", isWater: true },  // 50mg sodio per litro
            { name: "parmigiano reggiano", calcio: 1184, sodio: 1.5, marca: "Parmalat", isWater: false },
            { name: "grana padano", calcio: 1160, sodio: 1.4, marca: "Grana Padano", isWater: false },
            { name: "mozzarella", calcio: 500, sodio: 0.4, marca: "Galbani", isWater: false },
            { name: "pane bianco", calcio: 60, sodio: 1.2, marca: "Panificio", isWater: false }
        ];

        // Funzione per aggiungere un alimento al database
        function addFoodToDatabase() {
            const name = document.getElementById('newFoodName').value.trim();
            const calcium = parseFloat(document.getElementById('newFoodCalcium').value.trim());
            const sodium = parseFloat(document.getElementById('newFoodSodium').value.trim());
            const marca = document.getElementById('newFoodMarca').value.trim();

            if (name && !isNaN(calcium) && !isNaN(sodium) && marca) {
                // Aggiungi il nuovo alimento al database
                foodDB.push({
                    name: name,
                    calcio: calcium,
                    sodio: sodium,
                    marca: marca,
                    isWater: false // Imposta come falso per gli alimenti, aggiungi logica se necessario per l'acqua
                });
                alert('Alimento aggiunto al database!');
                
                // Pulisci i campi
                document.getElementById('newFoodName').value = '';
                document.getElementById('newFoodCalcium').value = '';
                document.getElementById('newFoodSodium').value = '';
                document.getElementById('newFoodMarca').value = '';
            } else {
                alert('Compila tutti i campi correttamente!');
            }
        }

        // Aggiungi l'evento al bottone "Aggiungi Alimento"
        document.getElementById('addFoodButton').addEventListener('click', addFoodToDatabase);

        // Codice già esistente per la ricerca e l'aggiunta al diario
        function searchFood() {
            const searchTerm = document.getElementById('foodInput').value.trim().toLowerCase();
            const quantity = document.getElementById('quantityInput').value.trim();
            const resultDiv = document.getElementById('result');

            if (!searchTerm || !quantity) {
                resultDiv.textContent = "Inserisci un alimento e una quantità.";
                return;
            }

            // Ricerca alimenti nel database
            const result = foodDB.filter(food => food.name.toLowerCase().includes(searchTerm));

            if (result.length > 0) {
                const foodItem = result[0]; // Prendi il primo risultato
                displayFood(foodItem, quantity);
            } else {
                resultDiv.textContent = "Alimento non trovato nel database.";
            }
        }

        function displayFood(foodItem, quantity) {
            const resultDiv = document.getElementById('result');
            const quantityCalcium = foodItem.calcio * (quantity / 100); // Calcio in base alla quantità
            const quantitySodium = foodItem.sodio * (quantity / 100); // Sodio in base alla quantità

            // Se è acqua, il sodio è in milligrammi (mg), altrimenti è in grammi (g)
            const sodiumUnit = foodItem.isWater ? 'mg' : 'g';
            resultDiv.innerHTML = `
                <h3>Risultato Trovato:</h3>
                <p><strong>Nome:</strong> ${foodItem.name}</p>
                <p><strong>Marca:</strong> ${foodItem.marca}</p>
                <p><strong>Calcio:</strong> ${quantityCalcium.toFixed(2)} mg</p>
                <p><strong>Sodio:</strong> ${quantitySodium.toFixed(2)} ${sodiumUnit}</p>
            `;
        }

        function addToDiary() {
            const today = new Date().toDateString();
            const selectedFood = foodDB[0]; // Qui dovresti fare il selezionamento corretto del cibo dalla ricerca
            if (selectedFood) {
                let diaryData = JSON.parse(localStorage.getItem('diaryData')) || {};
                if (!diaryData[today]) {
                    diaryData[today] = [];
                }
                const quantity = parseFloat(document.getElementById('quantityInput').value.trim());
                selectedFood.quantity = quantity;
                diaryData[today].push(selectedFood);

                localStorage.setItem('diaryData', JSON.stringify(diaryData));
                updateDiary();
            }
        }

        function updateDiary() {
            const diaryList = document.getElementById('diaryList');
            diaryList.innerHTML = '';
            let diaryData = JSON.parse(localStorage.getItem('diaryData')) || {};
            const today = new Date().toDateString();
            const dailyEntries = diaryData[today] || [];

            dailyEntries.forEach(item => {
                const listItem = document.createElement('li');
                listItem.innerHTML = `
                    <h3>${item.name}</h3>
                    <p><strong>Calcio:</strong> ${item.calcio} mg</p>
                    <p><strong>Sodio:</strong> ${item.sodio} g</p>  <!-- Il sodio è ora in grammi -->
                `;
                diaryList.appendChild(listItem);
            });
        }

        // Carica il diario all'avvio
        window.onload = function() {
            updateDiary();
        };
    </script>
</body>
</html>
